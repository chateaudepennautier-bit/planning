<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planning</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1a;--mut:#6b6a66;--bord:#dedbd4;--carte:#fff;--acc:#7a5c3e;--ombre:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#eceae6;--mut:#9a9892;--bord:#33323a;--carte:#1f1f24;--acc:#c9a227;--ombre:none}
 td.ct{color:var(--cs)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{padding:16px 20px 12px;border-bottom:1px solid var(--bord);background:var(--carte);position:sticky;top:0;z-index:30}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.meta{margin-top:4px;font-size:12.5px;color:var(--mut)}
.meta b{font-weight:600;color:var(--fg)}
.barre{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.onglets{display:flex;gap:6px;flex-wrap:wrap}
.onglet,.bascule button{border:1px solid var(--bord);background:transparent;color:var(--mut);
 padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.onglet.actif{background:var(--acc);border-color:var(--acc);color:#fff}
.bascule{display:flex;gap:4px;margin-left:auto}
.bascule button.actif{background:var(--fg);border-color:var(--fg);color:var(--bg)}
main{padding:16px 20px 60px}
.pane,.vue{display:none}.pane.actif{display:block}.pane.actif .vue.actif{display:block}
.tw{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--bord);border-radius:10px;background:var(--carte)}
table{border-collapse:collapse;font-size:13.5px;width:max-content;min-width:100%}
td{border:1px solid var(--bord);padding:5px 9px;vertical-align:middle;white-space:nowrap;
 max-width:300px;overflow:hidden;text-overflow:ellipsis}
.fige tr.hdr td{position:sticky;top:0;z-index:12;background:var(--carte);box-shadow:inset 0 -1px 0 var(--bord)}
.fige td:first-child{position:sticky;left:0;z-index:11;background:var(--carte);box-shadow:inset -1px 0 0 var(--bord)}
.fige tr.hdr td:first-child{z-index:13}
tr.sep td{height:9px;border-left:none;border-right:none;background:transparent}
col.hid{visibility:collapse}
td.ct{color:var(--cc)}
.vide{color:var(--mut);font-style:italic;padding:14px 0}
.jours{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.jour{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;box-shadow:var(--ombre)}
.jour>header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;
 padding-bottom:8px;border-bottom:1px solid var(--bord)}
.jour h3{margin:0;font-size:15.5px;font-weight:650}
.evt{font-size:11.5px;background:var(--acc);color:#fff;padding:2px 8px;border-radius:999px}
.bloc{margin-top:10px}
.bloc h4{margin:0 0 5px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.bloc ul{margin:0;padding:0;list-style:none}
.bloc li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px;align-items:baseline}
.qui{font-weight:600}
.quand{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.note{font-style:normal;font-size:11px;color:var(--acc)}
.apart{grid-column:1/-1;color:var(--mut);font-size:13px;margin:2px 0 0}
footer{padding:0 20px 34px;color:var(--mut);font-size:12px}
#verrou{max-width:380px;margin:14vh auto;padding:26px;background:var(--carte);
 border:1px solid var(--bord);border-radius:14px;box-shadow:var(--ombre)}
#verrou h2{margin:0 0 6px;font-size:17px}
#verrou p{margin:0 0 16px;color:var(--mut);font-size:13.5px}
#verrou input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--bord);
 border-radius:8px;background:var(--bg);color:var(--fg)}
#verrou button{width:100%;margin-top:10px;padding:10px;font:inherit;font-weight:600;border:0;
 border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
#verrou button:disabled{opacity:.55;cursor:progress}
#verrou label{display:flex;gap:7px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--mut)}
#verrou label input{width:auto}
#err{color:#c0392b;font-size:13px;margin-top:10px;min-height:1em}
@media(max-width:900px){td.ban{text-align:left}td.ban span{position:sticky;left:0;display:inline-block}}
@media(max-width:640px){main{padding:12px}header.top{padding:13px 14px}table{font-size:12.5px}
 td{padding:4px 7px}.tw{max-height:none}.jours{grid-template-columns:1fr}footer{padding:0 14px 30px}}
</style>
</head><body>

var RAFRAICHIR = 300;

function b2a(b){var s='';var v=new Uint8Array(b);for(var i=0;i<v.length;i++)s+=String.fromCharCode(v[i]);return s}
function a2b(s){var r=atob(s),v=new Uint8Array(r.length);for(var i=0;i<r.length;i++)v[i]=r.charCodeAt(i);return v}

function brancher(){
  var app=document.getElementById('app');
  var barre=app.querySelector('#barre');
  // la barre est deplacee dans l'entete : on interroge donc le document entier
  // pour les onglets et la bascule, et #app pour les contenus.
  if(barre) document.getElementById('entete-barre').appendChild(barre);

  document.querySelectorAll('.onglet').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.onglet').forEach(function(x){x.classList.remove('actif')});
      app.querySelectorAll('.pane').forEach(function(x){x.classList.remove('actif')});
      b.classList.add('actif');
      var t=document.getElementById(b.dataset.cible); if(t) t.classList.add('actif');
    });
  });

  function appliquer(v){
    app.querySelectorAll('.vue').forEach(function(x){x.classList.toggle('actif',x.dataset.vue===v)});
    document.querySelectorAll('.bascule button').forEach(function(x){x.classList.toggle('actif',x.dataset.vue===v)});
    try{localStorage.setItem('vue',v)}catch(e){}
  }
  var choix=null; try{choix=localStorage.getItem('vue')}catch(e){}
  appliquer(choix||(window.innerWidth<900?'jour':'tableau'));
  document.querySelectorAll('.bascule button').forEach(function(b){
    b.addEventListener('click',function(){appliquer(b.dataset.vue)});
  });

  var t; function relance(){clearTimeout(t);t=setTimeout(function(){
    location.replace(location.pathname+'?t='+Date.now());
  },RAFRAICHIR*1000)}
  ['click','keydown','scroll','touchstart'].forEach(function(e){
    document.addEventListener(e,relance,{passive:true})});
  relance();
}

if(!CHIFFRE){ brancher(); }
else {
  var err=document.getElementById('err');
  var bouton=document.getElementById('ok');

  function deverrouiller(mdp,retenir){
    bouton.disabled=true; err.textContent='Déchiffrement…';
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(mdp),'PBKDF2',false,['deriveKey'])
      .then(function(k){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:a2b(CHIFFRE.sel),iterations:CHIFFRE.tours,hash:'SHA-256'},
          k,{name:'AES-GCM',length:256},false,['decrypt']);
      })
      .then(function(cle){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:a2b(CHIFFRE.iv)},cle,a2b(CHIFFRE.data));
      })
      .then(function(clair){
        document.getElementById('app').innerHTML=new TextDecoder().decode(clair);
        document.getElementById('verrou').remove();
        if(retenir){ try{localStorage.setItem('code',mdp)}catch(e){} }
        brancher();
      })
      .catch(function(){
        bouton.disabled=false; err.textContent='Code incorrect.';
        try{localStorage.removeItem('code')}catch(e){}
        var i=document.getElementById('mdp'); i.value=''; i.focus();
      });
  }

  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    deverrouiller(document.getElementById('mdp').value,
                  document.getElementById('retenir').checked);
  });

  var memo=null; try{memo=localStorage.getItem('code')}catch(e){}
  if(memo){ document.getElementById('retenir').checked=true; deverrouiller(memo,true); }
}
</script>
